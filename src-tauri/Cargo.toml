[package]
name = "criptovisualizer"
version = "0.1.0"
description = "Observatório pessoal de criptomoedas"
authors = ["CriptoVisualizer"]
edition = "2021"
rust-version = "1.85"
default-run = "criptovisualizer"

[[bin]]
name = "fake-agent"
path = "tests/fixtures/fake-agent.rs"
test = false
bench = false
required-features = ["test-agent"]

[features]
test-agent = []

[[test]]
name = "ai"
path = "tests/ai.rs"
required-features = ["test-agent"]

[lib]
name = "criptovisualizer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rand = "0.9"
tempfile = "3"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"
