<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Seu observatório pessoal de criptomoedas. Dados públicos, indicadores locais e análise contextual por IA." />
    <title>CriptoVisualizer</title>
    <meta name="theme-color" content="#0b0f19" />
    <style>
      html, body {
        background-color: #0b0f19;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      @keyframes cv-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('root');
        if (el && !el.hasChildNodes() || !document.querySelector('.app-shell')) {
          console.error('[CriptoVisualizer early error]', e.error || e.message);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex; height:100vh; width:100vw; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:#0b0f19; color:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; user-select:none;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:22px; height:22px; border:2.5px solid #1e293b; border-top-color:#38bdf8; border-radius:50%; animation:cv-spin 0.8s linear infinite;"></div>
          <span style="font-size:17px; font-weight:700; color:#f8fafc; letter-spacing:-0.01em;">CriptoVisualizer</span>
        </div>
        <div style="font-size:12px; color:#64748b;">Iniciando observatório de mercado...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
